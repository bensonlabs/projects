name: Checks
# Shared by bensonlabs/games and bensonlabs/projects (.github/workflows/ci.yml): the copies are
# identical (tools/check_shared.py checks it), so change both. Steps only games needs say so in
# their `if:`.
#
# Pull requests; pushes to main run the same checks in release.yml before releasing. Also lints
# the workflow files (actionlint, with shellcheck on their scripts), and checks that the files
# shared with the other content repos still match.
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - if: github.event.repository.name == 'games'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: games/dungeon-crawler/package-lock.json
      - name: Test the tools
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Build and pack everything (as a release would)
        run: python3 tools/pack.py
      - name: Check the dungeon crawler build
        if: github.event.repository.name == 'games'
        run: python3 tools/check_dungeon_build.py
      - name: Packing changes no committed file
        run: git diff --exit-code

  workflows:
    name: Lint the workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # A pinned actionlint release, checked against its published sha256 before it runs.
      - name: actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  shared:
    name: Shared files match the other repos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Each file shared with bensonlabs/games, projects or bootstraps must match the copies there
      # (on a branch of this branch's name if they have one, else main): tools/check_shared.py.
      - name: Compare the shared files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/check_shared.py
